name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build package
        run: vp run @botiverse/raft-ui#build

      - name: Check workspace
        run: vp check

      - name: Check docs
        run: node scripts/check-docs.mjs

      - name: Run tests
        run: vp run -r test

      - name: Pack package
        run: vp pm pack --filter @botiverse/raft-ui --pack-destination "$RUNNER_TEMP/raft-ui-pack"
