name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build package
        run: vp run @botiverse/raft-ui#build

      - name: Check workspace
        run: vp check

      - name: Check docs
        run: node scripts/check-docs.mjs --strict

      - name: Check translations
        run: node scripts/i18n.mjs check

      - name: Run tests
        run: vp run -r test

      - name: Pack package
        run: vp pm pack --filter @botiverse/raft-ui --pack-destination "$RUNNER_TEMP/raft-ui-pack"

  docs-build:
    # The docs site deploys through Cloudflare Workers Builds, whose log only the
    # Cloudflare dashboard shows. Build it here too, so a broken site build fails
    # a PR where everyone can read why, and record how much memory it takes.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build package
        run: vp run @botiverse/raft-ui#build

      - name: Build docs site
        working-directory: apps/doc
        run: /usr/bin/time -v pnpm run build 2>&1 | tee "$RUNNER_TEMP/docs-build.log"; exit "${PIPESTATUS[0]}"
        shell: bash

      - name: Peak memory
        if: always()
        run: grep -E "Maximum resident set size|Exit status|Elapsed" "$RUNNER_TEMP/docs-build.log" || true
