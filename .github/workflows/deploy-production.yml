name: Deploy Production
on:
  push:
    branches: [production]
    paths:
      - ".github/workflows/deploy-production.yml"
      - "docs/**"
      - "packages/server/**"
      - "packages/shared/**"
      - "fly.toml"
      - "pnpm-lock.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --app slock-server --config fly.toml --local-only --build-arg SLOCK_RELEASE_SHA=${GITHUB_SHA}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}
