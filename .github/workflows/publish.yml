name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check workspace
        run: vp check

      - name: Build package
        run: vp run cuvii-rui#build

      - name: Pack package
        run: pnpm --dir packages/ui pack --pack-destination "$RUNNER_TEMP/cuvii-rui-pack"

      - name: Publish package
        run: npm publish "$RUNNER_TEMP"/cuvii-rui-pack/cuvii-rui-*.tgz --access public
