name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Check workspace
        run: vp check

      - name: Build package
        run: vp run raft-ui#build

      - name: Pack package
        run: vp pm pack --filter raft-ui --pack-destination "$RUNNER_TEMP/raft-ui-pack"

      - name: Publish package
        run: npm publish "$RUNNER_TEMP"/raft-ui-pack/raft-ui-*.tgz --access public

      - name: Create GitHub release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          current_tag="$GITHUB_REF_NAME"
          previous_tag="$(git tag --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || true)"

          if [ -n "$previous_tag" ]; then
            range="$previous_tag..$current_tag"
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${current_tag}"
          else
            range="$current_tag"
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/commits/${current_tag}"
          fi

          {
            echo "## Changes"
            git log "$range" --pretty=format:"- %s (%h)"
            echo
            echo
            echo "**Full Changelog**: $changelog_url"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
