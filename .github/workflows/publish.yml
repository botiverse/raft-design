name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "26"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build package
        run: vp run @botiverse/raft-ui#build

      - name: Check workspace
        run: vp check

      - name: Pack package
        run: vp pm pack --filter @botiverse/raft-ui --pack-destination "$RUNNER_TEMP/raft-ui-pack"

      - name: Stage package on npm
        # Staged publishing: the trusted publisher may only stage. The version goes
        # live when a maintainer approves it with 2FA, on npmjs.com or with
        # `npm stage approve <stage-id>`. A version already on npm (the first
        # release was published by hand, or a re-run) is skipped.
        run: |
          version="$(node -p "require('./packages/ui/package.json').version")"
          if npm view "@botiverse/raft-ui@$version" version >/dev/null 2>&1; then
            echo "@botiverse/raft-ui@$version is already on npm; skipping."
          else
            npx --yes npm@11.19.0 stage publish "$RUNNER_TEMP"/raft-ui-pack/botiverse-raft-ui-*.tgz --access public
            echo "Staged @botiverse/raft-ui@$version. Approve it on npmjs.com or with npm stage approve."
          fi

      - name: Create GitHub release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          current_tag="$GITHUB_REF_NAME"
          previous_tag="$(git tag --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || true)"

          node scripts/release-notes.mjs "$current_tag" > "$RUNNER_TEMP/release-notes.md"

          if [ -n "$previous_tag" ]; then
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${current_tag}"
          else
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/commits/${current_tag}"
          fi

          {
            echo
            echo "**Full Changelog**: $changelog_url"
          } >> "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; skipping."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --verify-tag
          fi
