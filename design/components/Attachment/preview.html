<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Attachment</title>
</head>
<body>
<div class="rf rf-pv">
  <div class="rf-pv__cols">
    <div class="rf-pv__col" data-pv-light>
      <span class="rf-pv__label">Light · in a message, in the composer</span>
      <div class="rf-pv__pane" data-theme="light">
        <div class="rf-file"><span class="rf-file__icon">PDF</span><span class="rf-file__body"><a class="rf-file__name" href="#">release-notes.pdf</a><span class="rf-file__meta">2.4 MB · PDF</span></span><button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Download release-notes.pdf"><i class="rf-i rf-i-download"></i></button></div>
        <div class="rf-file"><span class="rf-file__icon"><i class="rf-i rf-i-file-code"></i></span><span class="rf-file__body"><a class="rf-file__name" href="#">AppShell.tsx</a><span class="rf-file__meta">12 KB · TypeScript</span></span><button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Open AppShell.tsx in a new tab"><i class="rf-i rf-i-external-link"></i></button></div>
        <div class="rf-file"><span class="rf-file__icon"><i class="rf-i rf-i-image"></i></span><span class="rf-file__body"><span class="rf-file__name">design-crop.png</span><span class="rf-file__meta">Uploading · 64%</span><span class="rf-file__bar" role="progressbar" aria-label="Uploading design-crop.png" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100"><i style="width:64%"></i></span></span><button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Cancel upload of design-crop.png"><i class="rf-i rf-i-x"></i></button></div>
        <div class="rf-file is-failed"><span class="rf-file__icon"><i class="rf-i rf-i-triangle-alert"></i></span><span class="rf-file__body"><span class="rf-file__name">screen-recording.mov</span><span class="rf-file__error">Too big: 412 MB, the limit is 200 MB.</span></span><button class="rf-btn rf-btn--ghost rf-btn--sm" type="button">Remove</button></div>
        <span class="rf-media"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Screenshot: onboarding, step 2"><rect width="320" height="200" fill="#ffffff"/><rect width="320" height="44" fill="#ffd440"/><rect x="16" y="14" width="88" height="16" fill="#141111"/><rect x="16" y="64" width="200" height="12" fill="#d9d9d9"/><rect x="16" y="88" width="260" height="12" fill="#d9d9d9"/><rect x="16" y="112" width="150" height="12" fill="#d9d9d9"/><rect x="16" y="148" width="120" height="32" fill="#ff99c3" stroke="#141111" stroke-width="2"/></svg></span>
        <div class="rf-media-grid"><span class="rf-media"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Photo: the team offsite"><rect width="320" height="200" fill="#9fd7f0"/><rect x="232" y="28" width="40" height="40" fill="#ffd440"/><path d="M0 150 L80 96 L150 140 L220 84 L320 150 V200 H0Z" fill="#6aa84f"/><rect y="170" width="320" height="30" fill="#a9d877"/></svg></span><span class="rf-media"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Screenshot: onboarding, step 2"><rect width="320" height="200" fill="#ffffff"/><rect width="320" height="44" fill="#ffd440"/><rect x="16" y="14" width="88" height="16" fill="#141111"/><rect x="16" y="64" width="200" height="12" fill="#d9d9d9"/><rect x="16" y="88" width="260" height="12" fill="#d9d9d9"/><rect x="16" y="112" width="150" height="12" fill="#d9d9d9"/><rect x="16" y="148" width="120" height="32" fill="#ff99c3" stroke="#141111" stroke-width="2"/></svg></span></div>
        <div class="rf-composer">
          <div class="rf-thumbs">
            <span class="rf-thumb"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Screenshot: onboarding, step 2"><rect width="320" height="200" fill="#ffffff"/><rect width="320" height="44" fill="#ffd440"/><rect x="16" y="14" width="88" height="16" fill="#141111"/><rect x="16" y="64" width="200" height="12" fill="#d9d9d9"/><rect x="16" y="88" width="260" height="12" fill="#d9d9d9"/><rect x="16" y="112" width="150" height="12" fill="#d9d9d9"/><rect x="16" y="148" width="120" height="32" fill="#ff99c3" stroke="#141111" stroke-width="2"/></svg><button class="rf-thumb__x" type="button" aria-label="Remove onboarding screenshot"><i class="rf-i rf-i-x"></i></button></span>
            <span class="rf-thumb"><svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Photo: the team offsite"><rect width="320" height="200" fill="#9fd7f0"/><rect x="232" y="28" width="40" height="40" fill="#ffd440"/><path d="M0 150 L80 96 L150 140 L220 84 L320 150 V200 H0Z" fill="#6aa84f"/><rect y="170" width="320" height="30" fill="#a9d877"/></svg><span class="rf-thumb__bar" role="progressbar" aria-label="Uploading offsite photo" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"><i style="width:40%"></i></span><button class="rf-thumb__x" type="button" aria-label="Cancel uploading offsite photo"><i class="rf-i rf-i-x"></i></button></span>
            <span class="rf-thumb"><span class="rf-thumb__ext">PDF</span><button class="rf-thumb__x" type="button" aria-label="Remove release-notes.pdf"><i class="rf-i rf-i-x"></i></button></span>
          </div>
          <textarea class="rf-composer__input" rows="1" placeholder="Add a note…" aria-label="Message"></textarea>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var cols = document.querySelectorAll('[data-pv-light]');
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i], d = col.cloneNode(true);
    d.removeAttribute('data-pv-light');
    var panes = d.querySelectorAll('[data-theme]');
    for (var j = 0; j < panes.length; j++) panes[j].setAttribute('data-theme', 'dark');
    var l = d.querySelector('.rf-pv__label'); if (l) l.textContent = l.textContent.replace(/^Light/, 'Dark');
    col.parentNode.insertBefore(d, col.nextSibling);
  }
})();
</script>
</body>
</html>
