<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Checkbox</title></head>
<body>
<div class="rf rf-pv">
  <div class="rf-pv__row">
    <label class="rf-check"><input type="checkbox"><span class="rf-check__box"><i class="rf-i rf-i-check"></i></span>As Task</label>
    <label class="rf-check"><input type="checkbox" checked><span class="rf-check__box"><i class="rf-i rf-i-check"></i></span>As Task</label>
    <label class="rf-check is-focus"><input type="checkbox" checked><span class="rf-check__box"><i class="rf-i rf-i-check"></i></span>Notify the channel when done</label>
    <label class="rf-check"><input type="checkbox" disabled><span class="rf-check__box"><i class="rf-i rf-i-check"></i></span>Send as the agent</label>
  </div>
</div>
</body>
</html>
