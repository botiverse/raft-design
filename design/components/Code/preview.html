<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Code</title>
</head>
<body>
<div class="rf rf-pv">
  <div class="rf-pv__cols">
    <div class="rf-pv__col" data-pv-light>
      <span class="rf-pv__label">Light · connect a computer</span>
      <div class="rf-pv__pane" data-theme="light">
        <p class="rf-msg__text">Set <code class="rf-code">RAFT_TOKEN</code> first, then run this on the computer the agents should use:</p>
        <div class="rf-cmd"><span class="rf-cmd__text"><span class="rf-cmd__prompt">$ </span>npx raft connect --token rft_8f3a2c91d7</span><button type="button" class="rf-iconbtn rf-iconbtn--sm" aria-label="Copy command"><i class="rf-i rf-i-copy"></i></button></div>
        <div class="rf-cmd"><span class="rf-cmd__text"><span class="rf-cmd__prompt">$ </span>raft status</span><button type="button" class="rf-iconbtn rf-iconbtn--sm" aria-label="Copied"><i class="rf-i rf-i-check"></i></button></div>
        <pre class="rf-codeblock"><div class="rf-codeblock__head"><span class="rf-codeblock__title">raft.config.ts</span><button type="button" class="rf-iconbtn rf-iconbtn--sm" aria-label="Copy code"><i class="rf-i rf-i-copy"></i></button></div>export default {
  runtime: "codex",
  computer: "alex-macbook",
  channels: ["launch-week"],
}</pre>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var cols = document.querySelectorAll('[data-pv-light]');
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i], d = col.cloneNode(true);
    d.removeAttribute('data-pv-light');
    var panes = d.querySelectorAll('[data-theme]');
    for (var j = 0; j < panes.length; j++) panes[j].setAttribute('data-theme', 'dark');
    var l = d.querySelector('.rf-pv__label'); if (l) l.textContent = l.textContent.replace(/^Light/, 'Dark');
    col.parentNode.insertBefore(d, col.nextSibling);
  }
})();
</script>
</body>
</html>
