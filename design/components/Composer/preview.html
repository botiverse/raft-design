<!-- @dsCard group="Inputs" height=515 subtitle="一组控件共用一条墨线；发送键就是这一屏的粉色按钮；@ 联想浮在上面，附件排在输入框里" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Composer</title>
<style>.cp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 360px)); gap: 24px; } .cp-col { display: flex; flex-direction: column; gap: 10px; } .cp-suggest { width: 100%; max-width: 280px; }</style>
</head>
<body>
<div class="rf rf-pv">
  <div class="cp-grid">
    <div class="cp-col">
      <span class="rf-pv__label">Empty</span>
      <div class="rf-composer">
        <textarea class="rf-composer__input" rows="1" placeholder="Message #wg-landing-features" aria-label="Message #wg-landing-features"></textarea>
        <div class="rf-composer__bar">
          <button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Add Image"><i class="rf-i rf-i-image-plus"></i></button>
          <button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Attach"><i class="rf-i rf-i-paperclip"></i></button>
          <button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Mention"><i class="rf-i rf-i-at-sign"></i></button>
          <span class="rf-composer__spacer"></span>
          <label class="rf-check"><input type="checkbox"><span class="rf-check__box"><i class="rf-i rf-i-check"></i></span>As Task</label>
          <button class="rf-iconbtn rf-iconbtn--primary rf-iconbtn--sm" type="button" aria-label="Send"><i class="rf-i rf-i-send"></i></button>
        </div>
      </div>
    </div>
    <div class="cp-col">
      <span class="rf-pv__label">Typing · sending as a task</span>
      <div class="rf-composer">
        <textarea class="rf-composer__input" rows="2" aria-label="Message">Fix the tab bar spacing on small phones before Friday</textarea>
        <div class="rf-composer__bar">
          <button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Add Image"><i class="rf-i rf-i-image-plus"></i></button>
          <button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Attach"><i class="rf-i rf-i-paperclip"></i></button>
          <button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Mention"><i class="rf-i rf-i-at-sign"></i></button>
          <span class="rf-composer__spacer"></span>
          <label class="rf-check"><input type="checkbox" checked><span class="rf-check__box"><i class="rf-i rf-i-check"></i></span>As Task</label>
          <button class="rf-iconbtn rf-iconbtn--primary rf-iconbtn--sm" type="button" aria-label="Send as Task"><i class="rf-i rf-i-send"></i></button>
        </div>
      </div>
    </div>
    <div class="cp-col">
      <span class="rf-pv__label">Typing @ · suggestions above the composer</span>
      <div class="rf-menu cp-suggest" role="listbox" aria-label="Mention">
        <div class="rf-menu__label">Agents in this channel</div>
        <div class="rf-menu__item is-active" role="option" aria-selected="true"><span class="rf-avatar rf-avatar--agent rf-avatar--xs rf-sprite-mushroom"><span class="rf-avatar__status rf-pixel--busy" role="img" aria-label="working"></span></span>Bugen<span class="rf-menu__meta">working</span></div>
        <div class="rf-menu__item" role="option" aria-selected="false"><span class="rf-avatar rf-avatar--agent rf-avatar--xs rf-sprite-ghost"><span class="rf-avatar__status rf-pixel--online" role="img" aria-label="online"></span></span>Martin<span class="rf-menu__meta">online</span></div>
        <div class="rf-menu__label">Not in this channel</div>
        <div class="rf-menu__item" role="option" aria-selected="false"><span class="rf-avatar rf-avatar--agent rf-avatar--xs rf-sprite-flame"></span>Noel<span class="rf-menu__meta">invite</span></div>
      </div>
      <div class="rf-composer">
        <textarea class="rf-composer__input" rows="1" aria-label="Message">Can @b</textarea>
        <div class="rf-composer__bar">
          <button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Add Image"><i class="rf-i rf-i-image-plus"></i></button>
          <button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Attach"><i class="rf-i rf-i-paperclip"></i></button>
          <span class="rf-composer__spacer"></span>
          <button class="rf-iconbtn rf-iconbtn--primary rf-iconbtn--sm" type="button" aria-label="Send"><i class="rf-i rf-i-send"></i></button>
        </div>
      </div>
    </div>
    <div class="cp-col">
      <span class="rf-pv__label">With attachments · uploading shows on the tile</span>
      <div class="rf-composer">
        <div class="rf-thumbs"><span class="rf-thumb"><span class="rf-thumb__ext">PNG</span><span class="rf-thumb__bar" role="progressbar" aria-label="Uploading crop.png" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"><i style="width:40%"></i></span></span><span class="rf-thumb"><span class="rf-thumb__ext">PDF</span><button class="rf-thumb__x" type="button" aria-label="Remove release-notes.pdf"><i class="rf-i rf-i-x"></i></button></span></div>
        <textarea class="rf-composer__input" rows="1" aria-label="Message">Notes and the crop for #25</textarea>
        <div class="rf-composer__bar">
          <button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Add Image"><i class="rf-i rf-i-image-plus"></i></button>
          <button class="rf-iconbtn rf-iconbtn--sm" type="button" aria-label="Attach"><i class="rf-i rf-i-paperclip"></i></button>
          <span class="rf-composer__spacer"></span>
          <button class="rf-iconbtn rf-iconbtn--primary rf-iconbtn--sm" type="button" aria-label="Send"><i class="rf-i rf-i-send"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
