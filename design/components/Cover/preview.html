<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css">
<title>Raft Design System</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 300px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 300px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 300px; }
  .y { fill: var(--yellow); }
  .p { fill: var(--pink); }
  .c { fill: var(--cyan); }
  .k { fill: var(--ink); }
  .sh { fill: var(--sticker-ink); }
  .edge { stroke: var(--sticker-ink); stroke-width: var(--border-control); }
  .blk { rx: var(--radius-lg); }
  .tile { rx: var(--radius-xs); }
  html[data-theme="dark"] .k { fill: var(--surface); }                                   /* the deep block stays deep in dark */
  html[data-theme="dark"] .edge { stroke: var(--sticker-edge); stroke-width: 3; }        /* die-cut ring instead of an invisible ink edge */
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 76px; line-height: .92; font-weight: 700; letter-spacing: -0.035em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">
<!--
  blocks      yellow 176×224 slab, the largest (brand) · ink 200×156 bleeding off the top-right (the deep; bound to ink so it survives dark) · pink 136×96 (the one action) · cyan 64×64 once (signal) — ≈36% of 960×300
  arrangement a staggered stack of stickers: each colour block wears shadow-sticker-lg's 4px sticker-ink offset and a border-control edge; bottoms step down left→right
  pattern     pixels, from “every dot is a pixel”: 8px squares on a space-2 checker dissolving off the ink block's lower edge, thinning row by row (24 units)
  scales      sides in space-2 multiples; gutters space-4; corners radius-lg (blocks), radius-xs (cyan tile); pixel squares square
-->
<rect class="k blk" x="296" y="-20" width="200" height="156" rx="14"/>
<rect class="k" x="296" y="136" width="8" height="8"/><rect class="k" x="312" y="136" width="8" height="8"/><rect class="k" x="328" y="136" width="8" height="8"/><rect class="k" x="344" y="136" width="8" height="8"/><rect class="k" x="360" y="136" width="8" height="8"/><rect class="k" x="376" y="136" width="8" height="8"/><rect class="k" x="392" y="136" width="8" height="8"/><rect class="k" x="408" y="136" width="8" height="8"/><rect class="k" x="424" y="136" width="8" height="8"/><rect class="k" x="440" y="136" width="8" height="8"/><rect class="k" x="456" y="136" width="8" height="8"/><rect class="k" x="472" y="136" width="8" height="8"/>
<rect class="k" x="304" y="144" width="8" height="8"/><rect class="k" x="336" y="144" width="8" height="8"/><rect class="k" x="368" y="144" width="8" height="8"/><rect class="k" x="400" y="144" width="8" height="8"/><rect class="k" x="432" y="144" width="8" height="8"/><rect class="k" x="464" y="144" width="8" height="8"/>
<rect class="k" x="312" y="152" width="8" height="8"/><rect class="k" x="376" y="152" width="8" height="8"/><rect class="k" x="440" y="152" width="8" height="8"/>
<rect class="k" x="400" y="160" width="8" height="8"/><rect class="k" x="464" y="160" width="8" height="8"/>
<rect class="k" x="440" y="168" width="8" height="8"/>
<rect class="sh blk" x="28" y="56" width="176" height="224" rx="14"/>
<rect class="y blk edge" x="24" y="52" width="176" height="224" rx="14"/>
<rect class="sh blk" x="220" y="164" width="136" height="96" rx="14"/>
<rect class="p blk edge" x="216" y="160" width="136" height="96" rx="14"/>
<rect class="sh tile" x="372" y="204" width="64" height="64" rx="4"/>
<rect class="c tile edge" x="368" y="200" width="64" height="64" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">Raft<br>Design<br>System</h1>
<p class="tag">The design language for every Raft product.</p>
</div>
</div>
</body>
</html>
