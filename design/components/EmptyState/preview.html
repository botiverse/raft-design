<!-- @dsCard group="Feedback" height=520 subtitle="空状态只有一种：灰色的 36 图标、不加框，灰色的句首大写标题，一句为什么空，最多一个往前走的按钮" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>EmptyState</title>
<style>.es-strip { margin: 0 auto; }</style>
</head>
<body>
<div class="rf rf-pv">
  <div class="rf-pv__cols">
    <div class="rf-pv__col" data-pv-light>
      <span class="rf-pv__label">Light · nothing yet</span>
      <div class="rf-pv__strip es-strip" data-theme="light">
        <div class="rf-empty">
          <span class="rf-empty__icon" aria-hidden="true"><i class="rf-i rf-i-square-check-big"></i></span>
          <div class="rf-empty__title">No tasks yet</div>
          <p class="rf-empty__body">Tick As Task when you send a message, and it lands here.</p>
          <div class="rf-empty__actions"><button class="rf-btn rf-btn--sm" type="button"><i class="rf-i rf-i-plus"></i>New Task</button></div>
        </div>
      </div>
      <span class="rf-pv__label">Light · a filter that matched nothing</span>
      <div class="rf-pv__strip es-strip" data-theme="light">
        <div class="rf-empty">
          <span class="rf-empty__icon" aria-hidden="true"><i class="rf-i rf-i-list-filter"></i></span>
          <div class="rf-empty__title">No tasks match these filters</div>
          <p class="rf-empty__body">Two filters are on: Channel and Assignee.</p>
          <div class="rf-empty__actions"><button class="rf-btn rf-btn--sm" type="button">Clear All</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var cols = document.querySelectorAll('[data-pv-light]');
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i], d = col.cloneNode(true);
    d.removeAttribute('data-pv-light');
    var panes = d.querySelectorAll('[data-theme]');
    for (var j = 0; j < panes.length; j++) panes[j].setAttribute('data-theme', 'dark');
    var ls = d.querySelectorAll('.rf-pv__label');
    for (var k = 0; k < ls.length; k++) ls[k].textContent = ls[k].textContent.replace(/^Light/, 'Dark');
    col.parentNode.insertBefore(d, col.nextSibling);
  }
})();
</script>
</body>
</html>
