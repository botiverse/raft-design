<!-- @dsCard group="Actions" height=320 subtitle="外框里、标题栏和控件组里不加框；单独放在内容里才有墨线；有鼠标时配一个 tooltip" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>IconButton</title></head>
<body>
<div class="rf rf-pv">
  <div class="rf-pv__cols">
    <span class="rf-pv__label">In the frame (Home) · bare, rest / pressed with something new · light</span>
    <span class="rf-pv__label">In the frame (Home) · bare, rest / pressed with something new · dark</span>
    <div class="rf-pv__strip" data-theme="light">
      <header class="rf-frame"><div class="rf-phone__status"><span>9:41</span><span class="rf-phone__icons"><i class="rf-i rf-i-signal"></i><i class="rf-i rf-i-wifi"></i><i class="rf-i rf-i-battery"></i></span></div><div class="rf-nav">
        <button class="rf-ws rf-ws--pill" type="button" aria-haspopup="menu"><span class="rf-ws__name">Raft HQ</span><i class="rf-i rf-i-chevron-down"></i></button>
        <div class="rf-nav__actions">
          <button type="button" class="rf-iconbtn" aria-label="Notifications"><i class="rf-i rf-i-bell"></i></button>
          <button type="button" class="rf-iconbtn is-pressed" aria-label="Notifications, 2 new"><i class="rf-i rf-i-bell"></i><span class="rf-pixel rf-pixel--attention" aria-hidden="true"></span></button>
        </div>
      </div></header>
    </div>
    <div class="rf-pv__strip" data-theme="dark">
      <header class="rf-frame"><div class="rf-phone__status"><span>9:41</span><span class="rf-phone__icons"><i class="rf-i rf-i-signal"></i><i class="rf-i rf-i-wifi"></i><i class="rf-i rf-i-battery"></i></span></div><div class="rf-nav">
        <button class="rf-ws rf-ws--pill" type="button" aria-haspopup="menu"><span class="rf-ws__name">Raft HQ</span><i class="rf-i rf-i-chevron-down"></i></button>
        <div class="rf-nav__actions">
          <button type="button" class="rf-iconbtn" aria-label="Notifications"><i class="rf-i rf-i-bell"></i></button>
          <button type="button" class="rf-iconbtn is-pressed" aria-label="Notifications, 2 new"><i class="rf-i rf-i-bell"></i><span class="rf-pixel rf-pixel--attention" aria-hidden="true"></span></button>
        </div>
      </div></header>
    </div>
  </div>
  <div class="rf-pv__row">
    <span class="rf-pv__label">In content · outline / primary (send) / pressed / small / disabled</span>
    <button type="button" class="rf-iconbtn rf-iconbtn--outline" aria-label="Filter"><i class="rf-i rf-i-list-filter"></i></button>
    <button type="button" class="rf-iconbtn rf-iconbtn--outline" aria-label="Attach"><i class="rf-i rf-i-paperclip"></i></button>
    <button type="button" class="rf-iconbtn rf-iconbtn--primary" aria-label="Send"><i class="rf-i rf-i-send"></i></button>
    <button type="button" class="rf-iconbtn rf-iconbtn--primary is-pressed" aria-label="Send"><i class="rf-i rf-i-send"></i></button>
    <button type="button" class="rf-iconbtn rf-iconbtn--sm rf-iconbtn--outline" aria-label="Copy command"><i class="rf-i rf-i-copy"></i></button>
    <button type="button" class="rf-iconbtn" aria-label="Archive" disabled><i class="rf-i rf-i-trash"></i></button>
  </div>
</div>
</body>
</html>
