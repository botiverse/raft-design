<!-- @dsCard group="Navigation" height=550 subtitle="桌面面板：每一列都是同一种 56 高的白色面板头；频道面板下面是 Chat / Tasks / Files 分页，线程面板最上面是原消息" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Panel</title>
<style>
  .pn-gap { height: 12px; background: var(--surface-sunken); border-bottom: var(--border-hairline) solid var(--line-seam); }
  .pn-compose { padding: 8px 20px 20px; }
</style>
</head>
<body>
<div class="rf rf-pv">
  <div class="rf-pv__cols">
    <div class="rf-pv__col" data-pv-light>
      <span class="rf-pv__label">Light · channel panel; thread panel</span>
      <div class="rf-pv__pane rf-pv__pane--flush" data-theme="light">
        <header class="rf-chead">
          <span class="rf-chan rf-chan--sm rf-chan--here"><i class="rf-i rf-i-hash"></i></span>
          <span class="rf-chead__text"><span class="rf-chead__name">launch-week</span><span class="rf-chead__sub">Ship the launch week · 5 members</span></span>
          <span class="rf-chead__spacer"></span>
          <button class="rf-iconbtn" type="button" aria-label="Channel details"><i class="rf-i rf-i-ellipsis"></i></button>
        </header>
        <div class="rf-tabs" role="tablist" aria-label="launch-week">
          <button class="rf-tabs__item is-on" type="button" role="tab" aria-selected="true">Chat</button>
          <button class="rf-tabs__item" type="button" role="tab" aria-selected="false">Tasks<span class="rf-tabs__count">5</span></button>
          <button class="rf-tabs__item" type="button" role="tab" aria-selected="false">Files</button>
        </div>
        <div class="pn-gap"></div>
        <section class="rf-thread" aria-label="Thread">
          <header class="rf-chead">
            <span class="rf-chead__text"><span class="rf-chead__name">Thread</span><span class="rf-chead__sub">#launch-week · 3 replies</span></span>
            <span class="rf-chead__spacer"></span>
            <button class="rf-iconbtn" type="button" aria-label="Close thread"><i class="rf-i rf-i-x"></i></button>
          </header>
          <div class="rf-msg rf-thread__origin">
            <span class="rf-avatar rf-avatar--human rf-msg__avatar">A</span>
            <div class="rf-msg__head"><span class="rf-msg__name">Alex</span><span class="rf-msg__time">10:40</span></div>
            <p class="rf-msg__text">Who can take the launch post?</p>
          </div>
          <div class="rf-event">3 replies</div>
          <div class="rf-msg">
            <span class="rf-avatar rf-avatar--agent rf-msg__avatar rf-sprite-crown"></span>
            <div class="rf-msg__head"><span class="rf-msg__name">Wug</span><span class="rf-tag">agent</span><span class="rf-msg__time">10:41</span></div>
            <p class="rf-msg__text">I'll draft it from the release notes.</p>
          </div>
          <div class="pn-compose"><div class="rf-composer"><textarea class="rf-composer__input" rows="1" placeholder="Reply…" aria-label="Reply"></textarea><div class="rf-composer__bar"><span class="rf-composer__spacer"></span><button class="rf-iconbtn rf-iconbtn--primary rf-iconbtn--sm" type="button" aria-label="Send"><i class="rf-i rf-i-send"></i></button></div></div></div>
        </section>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var cols = document.querySelectorAll('[data-pv-light]');
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i], d = col.cloneNode(true);
    d.removeAttribute('data-pv-light');
    var panes = d.querySelectorAll('[data-theme]');
    for (var j = 0; j < panes.length; j++) panes[j].setAttribute('data-theme', 'dark');
    var l = d.querySelector('.rf-pv__label'); if (l) l.textContent = l.textContent.replace(/^Light/, 'Dark');
    col.parentNode.insertBefore(d, col.nextSibling);
  }
})();
</script>
</body>
</html>
