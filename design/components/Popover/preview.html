<!-- @dsCard group="Overlays" height=350 subtitle="浮在触发物旁边：悬停 @某人 出资料卡（只读）；点开的 popover 里可以放控件" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Popover</title>
</head>
<body>
<div class="rf rf-pv">
  <div class="rf-pv__cols">
    <div class="rf-pv__col">
      <span class="rf-pv__label">Light · hover @Martin</span>
      <div class="rf-pv__pane" data-theme="light">
        <div class="rf-popover" role="dialog" aria-label="Martin">
          <div class="rf-popover__head">
            <span class="rf-avatar rf-avatar--agent rf-avatar--lg rf-sprite-ghost" role="img" aria-label="Martin"><span class="rf-avatar__status rf-pixel--busy" role="img" aria-label="working"></span></span>
            <div class="rf-popover__who"><div class="rf-popover__title">Martin <span class="rf-tag">agent</span></div><div class="rf-popover__sub">QA · Codex on Alex's MacBook</div></div>
          </div>
          <p class="rf-msg__status"><span class="rf-pixel rf-pixel--busy"></span>Reviewing <span class="rf-mono">#26</span>…</p>
          <div class="rf-popover__actions"><button class="rf-btn rf-btn--sm" type="button"><i class="rf-i rf-i-message-square"></i>Message</button><button class="rf-btn rf-btn--ghost rf-btn--sm" type="button">View Profile</button></div>
        </div>
      </div>
    </div>
    <div class="rf-pv__col">
      <span class="rf-pv__label">Dark · click: snooze notifications</span>
      <div class="rf-pv__pane" data-theme="dark">
        <div class="rf-popover" role="dialog" aria-labelledby="pp-t">
          <div class="rf-popover__title" id="pp-t">Snooze notifications</div>
          <div class="rf-radios" role="radiogroup" aria-labelledby="pp-t">
            <label class="rf-radio"><input type="radio" name="pp-snooze" checked><span class="rf-radio__dot"></span><span class="rf-radio__body"><span class="rf-radio__label">1 hour</span></span></label>
            <label class="rf-radio"><input type="radio" name="pp-snooze"><span class="rf-radio__dot"></span><span class="rf-radio__body"><span class="rf-radio__label">Until tomorrow, 9:00</span></span></label>
            <label class="rf-radio"><input type="radio" name="pp-snooze"><span class="rf-radio__dot"></span><span class="rf-radio__body"><span class="rf-radio__label">Until I turn it back on</span></span></label>
          </div>
          <div class="rf-popover__actions"><button class="rf-btn rf-btn--ghost rf-btn--sm" type="button">Cancel</button><button class="rf-btn rf-btn--sm" type="button">Snooze</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
