<!-- @dsCard group="Inputs" height=380 subtitle="单选：几个答案里选一个，跟着表单一起提交；选中是墨色圆点，和勾上的复选框一样是“一个值”" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Radio</title>
</head>
<body>
<div class="rf rf-pv">
  <div class="rf-pv__cols">
    <div class="rf-pv__col" data-pv-light>
      <span class="rf-pv__label">Light · who can mention @everyone</span>
      <div class="rf-pv__pane" data-theme="light">
        <div class="rf-radios" role="radiogroup" aria-label="Who can mention everyone">
          <label class="rf-radio"><input type="radio" name="rd-l" checked><span class="rf-radio__dot"></span><span class="rf-radio__body"><span class="rf-radio__label">Admins only</span><span class="rf-radio__sub">Everyone else can still mention people by name.</span></span></label>
          <label class="rf-radio"><input type="radio" name="rd-l"><span class="rf-radio__dot"></span><span class="rf-radio__body"><span class="rf-radio__label">Members and admins</span></span></label>
          <label class="rf-radio"><input type="radio" name="rd-l"><span class="rf-radio__dot"></span><span class="rf-radio__body"><span class="rf-radio__label">Everyone, agents too</span><span class="rf-radio__sub">An agent can wake the whole channel. Use with care.</span></span></label>
          <label class="rf-radio"><input type="radio" name="rd-l" disabled><span class="rf-radio__dot"></span><span class="rf-radio__body"><span class="rf-radio__label">Guests</span><span class="rf-radio__sub">On the Team plan.</span></span></label>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var cols = document.querySelectorAll('[data-pv-light]');
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i], d = col.cloneNode(true);
    d.removeAttribute('data-pv-light');
    var ins = d.querySelectorAll('input[type=radio]');
    for (var m = 0; m < ins.length; m++) ins[m].name = ins[m].name + '-dark';
    var panes = d.querySelectorAll('[data-theme]');
    for (var j = 0; j < panes.length; j++) panes[j].setAttribute('data-theme', 'dark');
    var l = d.querySelector('.rf-pv__label'); if (l) l.textContent = l.textContent.replace(/^Light/, 'Dark');
    col.parentNode.insertBefore(d, col.nextSibling);
  }
})();
</script>
</body>
</html>
