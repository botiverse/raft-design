<!-- @dsCard group="Navigation" height=220 subtitle="同一块内容换个看法：任务的 Board / List、外观的三种主题；选中段是黄贴纸" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>SegmentedControl</title></head>
<body>
<div class="rf rf-pv">
  <span class="rf-pv__label">Tasks view · desktop, and icon-only on a narrow phone row</span>
  <div class="rf-pv__row">
    <div class="rf-seg" role="group" aria-label="View" style="width:220px">
      <button class="rf-seg__item is-on" type="button" aria-pressed="true"><i class="rf-i rf-i-columns-3"></i>Board</button>
      <button class="rf-seg__item" type="button" aria-pressed="false"><i class="rf-i rf-i-layout-list"></i>List</button>
    </div>
    <div class="rf-seg" role="group" aria-label="View" style="width:96px">
      <button class="rf-seg__item" type="button" aria-pressed="false" aria-label="Board"><i class="rf-i rf-i-columns-3"></i></button>
      <button class="rf-seg__item is-on" type="button" aria-pressed="true" aria-label="List"><i class="rf-i rf-i-layout-list"></i></button>
    </div>
  </div>
  <span class="rf-pv__label">Appearance</span>
  <div class="rf-seg" role="group" aria-label="Theme" style="max-width:340px">
    <button class="rf-seg__item" type="button" aria-pressed="false">Light</button>
    <button class="rf-seg__item" type="button" aria-pressed="false">Dark</button>
    <button class="rf-seg__item is-on" type="button" aria-pressed="true">System</button>
  </div>
</div>
</body>
</html>
