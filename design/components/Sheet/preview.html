<!-- @dsCard group="Overlays" height=720 subtitle="抽屉：详情和设置从右边滑入（420），下面铺遮罩，手机上就是一整页；底部弹层放手机上的一小段说明或一张列表，同样铺遮罩。一次填完的大表单不用抽屉，用 Dialog 的宽版" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Sheet</title>
<style>
  .vs { display: flex; flex-direction: column; gap: 10px; }
  .vs + .vs { padding-top: 18px; border-top: var(--border-hairline) solid var(--line); }
  .vs__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .vs__name { font-size: 15px; line-height: 20px; font-weight: 700; color: var(--ink); }
  .vs__tag { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--ink-3); }
  .vs__note { max-width: 660px; margin: -4px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-2); }

  .sh-phone { height: 560px; border-radius: var(--radius-lg); background: var(--paper); }
  .sh-phone .rf-scrim { align-items: flex-end; padding: 0; }
  .sh-phone .rf-sheet { width: 100%; }
  .sh-desk { height: 560px; border-radius: var(--radius-lg); background: var(--paper); }
  .sh-desk .rf-drawer { height: 100%; }
  .sh-wide { height: 640px; flex-direction: row; justify-content: flex-end; background: var(--paper); }
  .sh-wide .rf-drawer { height: 100%; }
  .sh-gap { height: 16px; }
  .sh-steps { display: flex; flex-direction: column; gap: 10px; padding: 4px 16px 4px; margin: 0; list-style: none; }
  .sh-steps li { display: flex; align-items: center; gap: 10px; font-size: 15px; line-height: 20px; }
  .sh-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px 16px; }
</style>
</head>
<body>
<div class="rf rf-pv"><div class="rf-pv__cols"><div class="rf-pv__col"><span class="rf-pv__label">Light · phone: a short explanation from the bottom</span><div class="rf-pv__stage sh-phone" data-theme="light"><div class="rf-pv__stub"><i style="width:60%"></i><i style="width:85%"></i><i style="width:40%"></i></div><div class="rf-scrim"><div class="rf-sheet" role="dialog" aria-labelledby="sh-t"><span class="rf-sheet__grab" aria-hidden="true"></span><div class="rf-sheet__head"><span class="rf-sheet__title" id="sh-t">Add Raft to your Home Screen</span><button class="rf-iconbtn" type="button" aria-label="Close"><i class="rf-i rf-i-x"></i></button></div><p class="rf-sheet__sub">You get notifications, and Raft opens without the browser bar.</p><ol class="sh-steps"><li><span class="rf-step__mark">1</span>Tap Share in Safari's toolbar</li><li><span class="rf-step__mark">2</span>Choose Add to Home Screen</li></ol><div class="rf-sheet__actions"><button class="rf-btn rf-btn--primary rf-btn--block" type="button">Got It</button></div></div></div></div></div><div class="rf-pv__col"><span class="rf-pv__label">Dark · desktop: channel details from the right</span><div class="rf-pv__stage sh-desk" data-theme="dark"><div class="rf-pv__stub"><i style="width:60%"></i><i style="width:85%"></i><i style="width:40%"></i></div><div class="rf-scrim rf-scrim--sheet"><aside class="rf-drawer" role="dialog" aria-labelledby="sh-d"><div class="rf-drawer__head"><span class="rf-drawer__title" id="sh-d">Channel details</span><button class="rf-iconbtn" type="button" aria-label="Close"><i class="rf-i rf-i-x"></i></button></div><div class="rf-drawer__body"><div class="rf-field"><label class="rf-field__label" for="sh-name">Name</label><span class="rf-inputgroup"><span class="rf-inputgroup__addon">#</span><input class="rf-input" id="sh-name" value="launch-week"></span></div><div class="sh-gap"></div><div class="rf-field"><label class="rf-field__label" for="sh-topic">Description <span class="rf-field__opt">(optional)</span></label><textarea class="rf-textarea" id="sh-topic" rows="2">Everything we ship on Oct 20.</textarea></div></div><div class="rf-drawer__foot"><button class="rf-btn rf-btn--ghost" type="button">Cancel</button><button class="rf-btn rf-btn--primary" type="button">Save</button></div></aside></div></div></div></div></div>

</body>
</html>
