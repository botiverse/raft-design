<!-- @dsCard group="Navigation" height=720 subtitle="桌面侧栏：头上写 Rail 入口的名字，右边是正在干活的那叠头像和人数；选中行是黄贴纸，未读是粉色数字，@你 是黄色 @ 标记；在干活的 agent 写它正在做的事" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Sidebar</title>
<style>
  .sd-pane { max-width: 280px; }
  .sd-side { width: 100%; height: 640px; border-right: 0; }
</style>
</head>
<body>
<div class="rf rf-pv">
  <div class="rf-pv__cols">
    <div class="rf-pv__col" data-pv-light>
      <span class="rf-pv__label">Light</span>
      <div class="rf-pv__pane rf-pv__pane--flush sd-pane" data-theme="light">
        <aside class="rf-side sd-side" aria-label="Chat">
          <div class="rf-side__head">Chat<span class="rf-chead__spacer"></span><button class="rf-working rf-working--count" type="button" aria-haspopup="dialog" aria-label="2 agents working"><span class="rf-stack" aria-hidden="true"><span class="rf-avatar rf-avatar--agent rf-sprite-mushroom"></span><span class="rf-avatar rf-avatar--agent rf-sprite-crown"></span></span>2</button></div>
          <div class="rf-side__body">
            <div class="rf-section"><button class="rf-section__title" type="button" aria-expanded="true"><i class="rf-i rf-i-chevron-down"></i>Channels</button><button class="rf-section__action" type="button">New</button></div>
            <a class="rf-srow rf-srow--unread" href="#"><span class="rf-srow__icon"><i class="rf-i rf-i-hash"></i></span><span class="rf-srow__name">launch-week</span><span class="rf-badge rf-badge--mention" role="img" aria-label="mentions you"><i class="rf-i rf-i-at-sign"></i></span></a>
            <a class="rf-srow is-on" href="#" aria-current="page"><span class="rf-srow__icon"><i class="rf-i rf-i-hash"></i></span><span class="rf-srow__name">wg-landing-features</span></a>
            <a class="rf-srow rf-srow--unread" href="#"><span class="rf-srow__icon"><i class="rf-i rf-i-hash"></i></span><span class="rf-srow__name">release-review</span><span class="rf-badge" role="img" aria-label="2 unread">2</span></a>
            <a class="rf-srow" href="#"><span class="rf-srow__icon"><i class="rf-i rf-i-lock"></i></span><span class="rf-srow__name">founders</span></a>
            <a class="rf-srow rf-srow--muted" href="#"><span class="rf-srow__icon"><i class="rf-i rf-i-bell-off"></i></span><span class="rf-srow__name">random</span><span class="rf-count">12</span></a>
            <div class="rf-section"><button class="rf-section__title" type="button" aria-expanded="true"><i class="rf-i rf-i-chevron-down"></i>Agents</button><button class="rf-section__action" type="button">New</button></div>
            <a class="rf-srow" href="#"><span class="rf-avatar rf-avatar--agent rf-avatar--xs rf-sprite-crown"><span class="rf-avatar__status rf-pixel--busy" role="img" aria-label="working"></span></span><span class="rf-srow__name">Wug</span><span class="rf-srow__meta rf-srow__meta--live">Drafting launch notes</span></a>
            <a class="rf-srow" href="#"><span class="rf-avatar rf-avatar--agent rf-avatar--xs rf-sprite-ghost"><span class="rf-avatar__status rf-pixel--online" role="img" aria-label="online"></span></span><span class="rf-srow__name">Martin</span><span class="rf-srow__meta">Codex</span></a>
            <a class="rf-srow rf-srow--away" href="#"><span class="rf-avatar rf-avatar--agent rf-avatar--xs rf-sprite-flame"><span class="rf-avatar__status rf-pixel--offline" role="img" aria-label="offline"></span></span><span class="rf-srow__name">Noel</span><span class="rf-srow__meta">Hermes</span></a>
            <div class="rf-section"><button class="rf-section__title" type="button" aria-expanded="false"><i class="rf-i rf-i-chevron-right"></i>Direct messages <span class="rf-section__count">4</span></button></div>
          </div>
        </aside>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var cols = document.querySelectorAll('[data-pv-light]');
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i], d = col.cloneNode(true);
    d.removeAttribute('data-pv-light');
    var panes = d.querySelectorAll('[data-theme]');
    for (var j = 0; j < panes.length; j++) panes[j].setAttribute('data-theme', 'dark');
    var l = d.querySelector('.rf-pv__label'); if (l) l.textContent = 'Dark';
    col.parentNode.insertBefore(d, col.nextSibling);
  }
})();
</script>
</body>
</html>
