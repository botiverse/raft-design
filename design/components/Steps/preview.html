<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Steps</title>
</head>
<body>
<div class="rf rf-pv">
  <div class="rf-pv__cols">
    <div class="rf-pv__col" data-pv-light>
      <span class="rf-pv__label">Light · set up a workspace; create an agent (compact)</span>
      <div class="rf-pv__pane" data-theme="light">
        <ol class="rf-steps" aria-label="Setup">
          <li class="rf-step is-done"><span class="rf-step__mark"><i class="rf-i rf-i-check"></i></span><span class="rf-step__label">Your team</span></li>
          <li class="rf-step is-current" aria-current="step"><span class="rf-step__mark">2</span><span class="rf-step__label">Computer</span></li>
          <li class="rf-step"><span class="rf-step__mark">3</span><span class="rf-step__label">First agent</span></li>
        </ol>
        <ol class="rf-steps rf-steps--compact" aria-label="Create agent">
          <li class="rf-step is-done"><span class="rf-step__mark"><i class="rf-i rf-i-check"></i></span><span class="rf-step__label">Basics</span></li>
          <li class="rf-step is-done"><span class="rf-step__mark"><i class="rf-i rf-i-check"></i></span><span class="rf-step__label">Runtime</span></li>
          <li class="rf-step is-current" aria-current="step"><span class="rf-step__mark">3</span><span class="rf-step__label">Computer</span></li>
          <li class="rf-step"><span class="rf-step__mark">4</span><span class="rf-step__label">Review</span></li>
        </ol>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var cols = document.querySelectorAll('[data-pv-light]');
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i], d = col.cloneNode(true);
    d.removeAttribute('data-pv-light');
    var panes = d.querySelectorAll('[data-theme]');
    for (var j = 0; j < panes.length; j++) panes[j].setAttribute('data-theme', 'dark');
    var l = d.querySelector('.rf-pv__label'); if (l) l.textContent = l.textContent.replace(/^Light/, 'Dark');
    col.parentNode.insertBefore(d, col.nextSibling);
  }
})();
</script>
</body>
</html>
