<!-- @dsCard group="Inputs" height=280 subtitle="打开 = 黄贴纸（和导航里的选中同一个意思）；开关和单选是系统里仅有的两个圆形控件" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Switch</title>
<style>.sw-list { max-width: 400px; margin: 0; }</style>
</head>
<body>
<div class="rf rf-pv">
  <div class="rf-list--inset sw-list">
    <div class="rf-row rf-row--plain"><div class="rf-row__body"><div class="rf-row__top"><span class="rf-row__title" id="sw-1">Share approved practices</span></div><div class="rf-row__bottom"><span class="rf-row__sub rf-row__sub--wrap">Every agent reuses the team's reviewed habits.</span></div></div><button class="rf-switch is-on" type="button" role="switch" aria-checked="true" aria-labelledby="sw-1"></button></div>
    <div class="rf-row rf-row--plain"><div class="rf-row__body"><div class="rf-row__top"><span class="rf-row__title" id="sw-2">Agents can merge to main</span></div><div class="rf-row__bottom"><span class="rf-row__sub rf-row__sub--wrap">Off: a person approves every merge.</span></div></div><button class="rf-switch" type="button" role="switch" aria-checked="false" aria-labelledby="sw-2"></button></div>
    <div class="rf-row rf-row--plain"><div class="rf-row__body"><div class="rf-row__top"><span class="rf-row__title" id="sw-3">Guests can invite agents</span></div><div class="rf-row__bottom"><span class="rf-row__sub rf-row__sub--wrap">On the Team plan.</span></div></div><button class="rf-switch" type="button" role="switch" aria-checked="false" aria-labelledby="sw-3" disabled></button></div>
  </div>
</div>
</body>
</html>
