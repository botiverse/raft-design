<!-- @dsCard group="Navigation" height=410 subtitle="手机底部的一级入口，只在一级页上；选中项的图标坐在黄贴纸里，提醒点挂在图标右上" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>TabBar</title>
<style>
  .tb-strip { padding-top: 8px; }
</style>
</head>
<body>
<div class="rf rf-pv"><div class="rf-pv__cols"><div class="rf-pv__col" data-pv-light><span class="rf-pv__label">Light · Home</span><div class="rf-pv__strip tb-strip" data-theme="light"><div class="rf-pv__stub"><i style="width:62%"></i><i style="width:40%"></i></div><nav class="rf-tabbar" aria-label="Primary"><a class="rf-tab is-on" href="#" aria-current="page"><span class="rf-tab__icon"><i class="rf-i rf-i-house"></i></span>Home</a><a class="rf-tab" href="#"><span class="rf-tab__icon"><i class="rf-i rf-i-square-check-big"></i></span>Tasks</a><a class="rf-tab" href="#"><span class="rf-tab__icon"><i class="rf-i rf-i-users"></i></span>Members</a><a class="rf-tab" href="#" aria-label="Settings, new replies to your feedback"><span class="rf-tab__icon"><i class="rf-i rf-i-settings"></i><span class="rf-pixel rf-pixel--attention" aria-hidden="true"></span></span>Settings</a></nav></div></div><div class="rf-pv__col" data-pv-light><span class="rf-pv__label">Light · Tasks</span><div class="rf-pv__strip tb-strip" data-theme="light"><div class="rf-pv__stub"><i style="width:62%"></i><i style="width:40%"></i></div><nav class="rf-tabbar" aria-label="Primary"><a class="rf-tab" href="#"><span class="rf-tab__icon"><i class="rf-i rf-i-house"></i></span>Home</a><a class="rf-tab is-on" href="#" aria-current="page"><span class="rf-tab__icon"><i class="rf-i rf-i-square-check-big"></i></span>Tasks</a><a class="rf-tab" href="#"><span class="rf-tab__icon"><i class="rf-i rf-i-users"></i></span>Members</a><a class="rf-tab" href="#"><span class="rf-tab__icon"><i class="rf-i rf-i-settings"></i></span>Settings</a></nav></div></div></div></div>
<script>
(function () {
  var cols = document.querySelectorAll('[data-pv-light]');
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i], d = col.cloneNode(true);
    d.removeAttribute('data-pv-light');
    var panes = d.querySelectorAll('[data-theme]');
    for (var j = 0; j < panes.length; j++) panes[j].setAttribute('data-theme', 'dark');
    var ls = d.querySelectorAll('.rf-pv__label');
    for (var k = 0; k < ls.length; k++) ls[k].textContent = ls[k].textContent.replace(/^Light/, 'Dark');
    col.parentNode.insertBefore(d, col.nextSibling);
  }
})();
</script>
</body>
</html>
