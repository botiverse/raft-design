<!-- @dsCard group="Feedback" height=170 subtitle="提示只是提示：中性的深色浮层，不用黄；颜色只留给里面的头像和状态灯" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Toast</title></head>
<body>
<div class="rf rf-pv">
  <div class="rf-toast" style="max-width:380px">
    <span class="rf-avatar rf-avatar--agent rf-avatar--sm rf-sprite-ghost"><span class="rf-avatar__status rf-pixel--online" role="img" aria-label="online"></span></span>
    <span class="rf-toast__text"><b>Martin</b> finished reviewing <span class="rf-mono">#26</span>. All 14 checks passed.</span>
    <button type="button" class="rf-toast__action">View</button>
  </div>
  <div class="rf-toast" style="max-width:380px">
    <span class="rf-pixel rf-pixel--todo"></span>
    <span class="rf-toast__text">Sent as task <span class="rf-mono">#33</span>.</span>
    <button type="button" class="rf-toast__action">Undo</button>
  </div>
</div>
</body>
</html>
