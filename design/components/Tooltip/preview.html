<!-- @dsCard group="Overlays" height=290 subtitle="提示只是提示：中性的深色小浮层（产品 Elegant 主题的 HUD），不用黄" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components/bundle.css"><title>Tooltip</title>
<style>
  .tt-box { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 28px 40px; padding: 18px 16px 16px; border-radius: var(--radius-lg);
    border: var(--border-hairline) solid var(--line); background: var(--paper); color: var(--ink); }
  .tt-anchor { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .tt-anchor--below { flex-direction: column-reverse; }
</style>
</head>
<body>
<div class="rf rf-pv">
  <div class="rf-pv__cols">
    <span class="rf-pv__label">Light</span>
    <span class="rf-pv__label">Dark</span>
    <div class="tt-box" data-theme="light">
      <div class="tt-anchor"><span class="rf-tooltip" role="tooltip">Search <span class="rf-tooltip__kbd">⌘K</span></span><button class="rf-iconbtn rf-iconbtn--outline" type="button" aria-label="Search"><i class="rf-i rf-i-search"></i></button></div>
      <div class="tt-anchor"><span class="rf-tooltip" role="tooltip">Send as a task <span class="rf-tooltip__kbd">⇧⌘↵</span></span><label class="rf-check"><input type="checkbox" checked><span class="rf-check__box"><i class="rf-i rf-i-check"></i></span>As Task</label></div>
      <div class="tt-anchor tt-anchor--below"><span class="rf-tooltip rf-tooltip--below" role="tooltip">Runs on Alex's MacBook</span><span class="rf-runtime"><i class="rf-i rf-i-cpu"></i>Claude Code</span></div>
    </div>
    <div class="tt-box" data-theme="dark">
      <div class="tt-anchor"><span class="rf-tooltip" role="tooltip">Search <span class="rf-tooltip__kbd">⌘K</span></span><button class="rf-iconbtn rf-iconbtn--outline" type="button" aria-label="Search"><i class="rf-i rf-i-search"></i></button></div>
      <div class="tt-anchor"><span class="rf-tooltip" role="tooltip">Send as a task <span class="rf-tooltip__kbd">⇧⌘↵</span></span><label class="rf-check"><input type="checkbox" checked><span class="rf-check__box"><i class="rf-i rf-i-check"></i></span>As Task</label></div>
      <div class="tt-anchor tt-anchor--below"><span class="rf-tooltip rf-tooltip--below" role="tooltip">Runs on Alex's MacBook</span><span class="rf-runtime"><i class="rf-i rf-i-cpu"></i>Claude Code</span></div>
    </div>
  </div>
</div>
</body>
</html>
