# Local development: only PostgreSQL runs in Docker.
# Server and web are started via scripts/start-dev.sh (tmux).
# Production uses Railway (server) + Vercel (web) + Neon (DB).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: slock
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: slock123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
