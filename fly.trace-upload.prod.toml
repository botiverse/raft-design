app = "slock-trace-upload"
primary_region = "sin"

[build]
  dockerfile = "packages/trace-upload-worker/Dockerfile"

[env]
  NODE_ENV = "production"
  DEPLOYMENT_ENV = "production"
  PORT = "3000"
  R2_BUCKET = "slock-daemon-trace-bundles-prod"
  TRACE_INGEST_OTLP_ENDPOINT = "http://slock-telescope.internal:4318/v1/traces"
  TRACE_INGEST_SERVICE_NAME = "slock-daemon"
  TRACE_UPLOAD_MAX_BYTES = "52428800"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  processes = ["app"]
