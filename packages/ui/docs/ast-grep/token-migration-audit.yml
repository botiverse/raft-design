# ast-grep rules for component token migration audit.

id: migration-token-string
language: Tsx
severity: hint
message: old token / style-token usage in class string
rule:
  kind: string
  regex: '((^|[\s"''])(?:bg|text|border|ring|fill|stroke|divide)-(?:black|white)(?:/\d+)?($|[\s"''])|(?:^|[\s"''])(?:bg|text|border|ring|fill|stroke)-(?:primary|secondary|accent|success|warning)(?:-(?:foreground|border|soft|default|hover))?(?:/\d+)?($|[\s"''])|(?:^|[\s"''])(?:bg|text|border|ring|fill|stroke)-(?:neutral|muted|destructive|information)(?:-(?:foreground|border|soft|default|hover))?(?:/\d+)?($|[\s"''])|(?:bg|text|border|ring|fill|stroke)-action-|(?:bg|text|border|ring|fill|stroke)-surface-|(?:bg|text|border|ring|fill|stroke)-brutal-[a-z]+-(?:50|100|200|300|400|500|600|700|800|900|950)|shadow-brutal|border-border|ring-ring|information-|muted-foreground|neutral-|shadow-\[var\(--|\[box-shadow:var\(--|var\(--(?:input|dropdown|tabs|badge|checkbox|button|list-item|kbd|banner|surface|shadow|success|warning|information|destructive|neutral|muted|action)-|#[0-9a-fA-F]{3,8}|hsla?\()'

---
id: migration-css-declaration
language: Css
severity: hint
message: old token alias in CSS declaration
rule:
  kind: declaration
  regex: "(surface-|action-|destructive-|information-|muted-foreground|neutral-|border-border|shadow-brutal|surface-shadow|dropdown-shadow|tabs-chip-active-shadow|--input-|--dropdown-|--tabs-|--badge-|--checkbox-|--button-|--list-item-|--kbd-|--banner-|--shadow-surface|#[0-9a-fA-F]{3,8}|hsla?\\()"

---
id: migration-css-comment
language: Css
severity: hint
message: old token mention in CSS comment
rule:
  kind: comment
  regex: "(border-border|bg-brutal|action-|surface-|shadow-brutal)"
