<!doctype html>
<html lang="en" data-theme="brutal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project update</title>
    <link rel="stylesheet" href="../src/foundation.css" />
    <link rel="stylesheet" href="../src/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 20px;
        background: var(--layer-canvas);
        color: var(--foreground);
        font-family: var(--sans-font, system-ui, sans-serif);
        line-height: 1.5;
      }
      main {
        max-width: 640px;
        margin: auto;
      }
      h1 {
        font-family: var(--heading-font, system-ui, sans-serif);
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.1;
      }
      article {
        padding: 24px;
        border: 2px solid var(--line);
        background: var(--layer-panel);
        box-shadow: var(--theme-shadow-md);
      }
      .status {
        background: var(--primary-soft);
        color: var(--primary-strong);
        padding: 4px 8px;
      }
      details {
        margin-top: 24px;
        border-top: 1px solid var(--line);
        padding-top: 16px;
      }
      summary {
        cursor: pointer;
        font-weight: 700;
      }
      summary:focus-visible {
        outline: 2px solid var(--primary-strong);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ready for the next review.</h1>
      <article>
        <span class="status">In review</span>
        <h2>The first draft is complete</h2>
        <p>The team can now review the proposal and leave feedback before Friday.</p>
        <details>
          <summary>Review checklist</summary>
          <ul>
            <li>Confirm the scope and timeline.</li>
            <li>Identify missing dependencies.</li>
            <li>Assign the remaining decisions.</li>
          </ul>
        </details>
      </article>
    </main>
  </body>
</html>
