packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  tailwind-variants: ^3.2.2
  "@base-ui-components/react": 1.0.0-rc.0
  "@base-ui/react": ^1.5.0
  lucide-react: ^1.17.0
  tailwind-merge: ^3.6.0
  wrangler: ^4.95.0
  nitro: 3.0.260522-beta
  shiki: ^4.1.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: false
  workerd: true
