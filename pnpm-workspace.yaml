packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: latest
  tailwind-variants: ^3.2.2
  "@base-ui-components/react": 1.0.0-rc.0
  "@base-ui/react": ^1.5.0
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
  lucide-react: ^1.17.0
  tailwind-merge: ^3.6.0
  wrangler: ^4.98.0
  shiki: ^4.1.0
  "@tanstack/react-hotkeys": ^0.10.0
  "@cloudflare/vite-plugin": ^1.40.0
  portless: ^0.14.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.40.0"
  - miniflare@4.20260603.0
  - wrangler@4.98.0
