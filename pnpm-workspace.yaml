packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^26.6.2
  typescript: ^7.0.2
  # The TypeScript 5 compiler API: TypeScript 7 has no JS API yet. apps/doc
  # reads component props with it (scripts/build-api.mjs).
  typescript-api: npm:typescript@5.9.3
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest: 5.0.1
  vite-plus: 1.0.0
  tailwind-variants: ^3.3.1
  "@base-ui/react": ^1.8.0
  "@base-ui/utils": ^0.4.0
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
  lucide-react: ^1.48.0
  cnfast: ^0.2.0
  tailwind-merge: ^3.7.0
  wrangler: ^4.136.3
  shiki: ^4.4.3
  "@tanstack/react-hotkeys": ^0.11.0
  "@vitejs/plugin-rsc": ^0.5.35
  "@cloudflare/vite-plugin": ^1.57.3
  react-resizable-panels: ^4.13.2
  react-markdown: ^10.1.0
  rehype-sanitize: ^6.0.0
  remark-breaks: ^4.0.0
  remark-gfm: ^4.0.1
  motion: ^13.4.3
  "@tanstack/react-virtual": ^3.14.13
  "@tailwindcss/typography": ^0.5.20
  "@testing-library/dom": ^10.4.2
  "@testing-library/react": ^16.3.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1
  jsdom: ^30.1.1
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-router": 1.170.38
  "@tanstack/react-start": 1.168.57
  foxact: ^0.3.12
  react: ^19.3.0
  react-dom: ^19.3.0
  tailwindcss: ^4.3.3
  torph: ^0.1.3
  "@typescript/native-preview": 7.0.0-dev.20260707.2
  eslint-plugin-better-tailwindcss: ^4.7.0
  "@vitest/browser-playwright": 5.0.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - motion@13.4.3
  - "@typescript/typescript-aix-ppc64@7.0.2"
  - "@typescript/typescript-darwin-arm64@7.0.2"
  - "@typescript/typescript-darwin-x64@7.0.2"
  - "@typescript/typescript-freebsd-arm64@7.0.2"
  - "@typescript/typescript-freebsd-x64@7.0.2"
  - "@typescript/typescript-linux-arm64@7.0.2"
  - "@typescript/typescript-linux-arm@7.0.2"
  - "@typescript/typescript-linux-loong64@7.0.2"
  - "@typescript/typescript-linux-mips64el@7.0.2"
  - "@typescript/typescript-linux-ppc64@7.0.2"
  - "@typescript/typescript-linux-riscv64@7.0.2"
  - "@typescript/typescript-linux-s390x@7.0.2"
  - "@typescript/typescript-linux-x64@7.0.2"
  - "@typescript/typescript-netbsd-arm64@7.0.2"
  - "@typescript/typescript-netbsd-x64@7.0.2"
  - "@typescript/typescript-openbsd-arm64@7.0.2"
  - "@typescript/typescript-openbsd-x64@7.0.2"
  - "@typescript/typescript-sunos-x64@7.0.2"
  - "@typescript/typescript-win32-arm64@7.0.2"
  - "@typescript/typescript-win32-x64@7.0.2"
  - typescript@7.0.2
  - framer-motion@13.4.3
  - motion-dom@13.4.2
  - lucide-react@1.48.0
