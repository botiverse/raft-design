packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^25.9.3
  typescript: ^6.0.3
  vite: npm:@voidzero-dev/vite-plus-core@0.1.24
  vitest: npm:@voidzero-dev/vite-plus-test@0.1.24
  vite-plus: 0.1.24
  tailwind-variants: ^3.2.2
  "@base-ui-components/react": 1.0.0-rc.0
  "@base-ui/react": ^1.5.0
  "@base-ui/utils": ^0.3.0
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/utilities": ^3.2.2
  lucide-react: ^1.18.0
  nucleo-ui-fill-18: ^1.4.0
  nucleo-ui-fill-duo-18: ^1.4.0
  nucleo-ui-outline-18: ^1.4.1
  nucleo-ui-outline-duo-18: ^1.4.1
  tailwind-merge: ^3.6.0
  wrangler: ^4.100.0
  shiki: ^4.2.0
  "@tanstack/react-hotkeys": ^0.10.0
  "@vitejs/plugin-rsc": ^0.5.27
  "@cloudflare/vite-plugin": ^1.40.2
  portless: ^0.14.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  nucleo-ui-fill-18: true
  nucleo-ui-fill-duo-18: true
  nucleo-ui-outline-18: true
  nucleo-ui-outline-duo-18: true
  sharp: false
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.40.0"
  - miniflare@4.20260603.0
  - wrangler@4.98.0
